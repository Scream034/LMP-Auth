<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #0c0c14;
      color: #c8c8d8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .logo {
      width: 32px; height: 32px;
      background: #12121c;
      border: 1px solid #1e1e2e;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 16px; height: 16px; stroke: #7aa2f7; }
    .wordmark { font-weight: 600; font-size: 16px; color: #fff; }
    .desc { font-size: 12px; color: #8a8a9e; margin-bottom: 16px; line-height: 1.4; }
    .btn {
      background: #7aa2f7; color: #0c0c14; border: none; border-radius: 6px;
      padding: 10px; width: 100%; font-weight: 600; font-size: 13px; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { background: #2a2a3e; color: #5a5a6e; cursor: not-allowed; }
    .status { margin-top: 12px; font-size: 12px; text-align: center; min-height: 16px; }
    .status.ok { color: #4fd6be; }
    .status.warn { color: #e0af68; }
    .status.err { color: #f7768e; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <span class="wordmark">LMP Auth</span>
  </div>
  <div class="desc">Send your YouTube Music session to the Lite Music Player desktop app.</div>
  
  <button class="btn" id="sendBtn">Send to LMP</button>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
