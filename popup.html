<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 300px;
      margin: 0;
      padding: 14px;
      background: #0c0c14;
      color: #c8c8d8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .logo {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      background: #12121c;
      border: 1px solid #1e1e2e;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg {
      width: 16px;
      height: 16px;
      stroke: #7aa2f7;
    }

    .wordmark {
      font-weight: 600;
      font-size: 15px;
      color: #fff;
    }

    .desc {
      font-size: 12px;
      color: #8a8a9e;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    /* Server status pill */
    .server-status {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #12121c;
      border: 1px solid #1e1e2e;
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 10px;
      font-size: 11px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #5a5a6e;
    }

    .dot.ok {
      background: #4fd6be;
    }

    .dot.warn {
      background: #e0af68;
    }

    .dot.err {
      background: #f7768e;
    }

    .btn {
      background: #7aa2f7;
      color: #0c0c14;
      border: none;
      border-radius: 6px;
      padding: 10px;
      width: 100%;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:hover:not(:disabled) {
      opacity: 0.88;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled {
      background: #2a2a3e;
      color: #5a5a6e;
      cursor: not-allowed;
    }

    /* Action status */
    .status {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.5;
      min-height: 18px;
      word-break: break-word;
    }

    .status.ok {
      color: #4fd6be;
    }

    .status.warn {
      color: #e0af68;
    }

    .status.err {
      color: #f7768e;
    }

    /* Legend */
    .legend-toggle {
      background: none;
      border: none;
      padding: 0;
      margin-top: 10px;
      color: #5a5a8e;
      font-size: 11px;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }

    .legend-toggle:hover {
      color: #7aa2f7;
    }

    .legend-body {
      display: none;
      margin-top: 6px;
      background: #12121c;
      border: 1px solid #1e1e2e;
      border-radius: 6px;
      padding: 8px 10px;
    }

    .legend-body.open {
      display: block;
    }

    .legend-body p {
      margin: 0 0 4px;
      font-size: 11px;
      color: #8a8a9e;
      line-height: 1.5;
    }

    .legend-body p:last-child {
      margin-bottom: 0;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
      </svg>
    </div>
    <span class="wordmark">LMP Auth</span>
  </div>

  <div class="desc" id="desc"></div>

  <!-- Pill: is LMP open? -->
  <div class="server-status">
    <span class="dot" id="serverDot"></span>
    <span id="serverText"></span>
  </div>

  <button class="btn" id="sendBtn"></button>
  <div class="status" id="status"></div>

  <!-- Legend -->
  <button class="legend-toggle" id="legendToggle"></button>
  <div class="legend-body" id="legendBody">
    <p id="lg-checking"></p>
    <p id="lg-ready"></p>
    <p id="lg-notfound"></p>
    <p id="lg-ok"></p>
    <p id="lg-copied"></p>
    <p id="lg-nologin"></p>
  </div>

  <script src="popup.js"></script>
</body>

</html>
